name: Build, validate, deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i --no-save ajv-draft-04@1.0.0 ajv@8.17.1
      - run: node scripts/build.mjs
      - run: node scripts/validate.mjs
        env:
          CI: "true"
      - name: Fail if the committed CLI snapshot is stale
        run: git diff --exit-code -- cli/cv.snapshot.json cli/lib.mjs
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --exclude linkedin.com --exclude chatgpt.com --exclude claude.ai --exclude perplexity.ai --exclude 'ernestmoyo\.com' --exclude malariaatlas.org 'dist/**/*.html' 'dist/**/*.txt' 'dist/cv.json'
          fail: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
